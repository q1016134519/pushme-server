name: docker

# 打 tag（v*）或手动触发时构建镜像并推到 GHCR：
#   ghcr.io/<owner>/pushme-server:<package.json 版本>
#   ghcr.io/<owner>/pushme-server:latest
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER"     >> "$GITHUB_OUTPUT"
          echo "building $OWNER/pushme-server:$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建上下文必须是仓库根目录，Dockerfile 在 docker/ 下
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/pushme-server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/pushme-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
