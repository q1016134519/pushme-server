# 面板反向代理配置（粘到 宝塔 → 网站 → 站点 → 设置 → 配置文件 的 server{} 里）
#
# 前提：面板本身跑在 127.0.0.1:3010（docker -p 3010:3010 或 Node 项目 3010）
# 只反代「面板」这一个 HTTP 端口。
#
# ⚠ 3100 千万不要在这里做 HTTP 反向代理：
#    它跑的是 MQTT / WebSocket 原始协议，走 80/443 会被当成普通 HTTP 撕碎。
#    客户端直连 IP:3100，在宝塔「安全」里放行 TCP 3100 即可。
#    如果 3100 不能对外（只有 443 出网），见 docs 里的 nginx stream 方案。

location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 登录 cookie 走签名，别让缓存搅乱
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 面板里「在线测试」「日志」有轮询，别被 buffering 卡住
    proxy_set_header Connection "";
}
