<div class="field">
    <label for="user">账号</label>
    <input class="input" type="text" id="user" name="user" placeholder="请输入账号" autocomplete="username">
</div>
<div class="field">
    <label for="password">密码</label>
    <input class="input" type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
</div>
